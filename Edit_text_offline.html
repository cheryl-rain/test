</g></svg></div><aside><b>文字编辑</b><p class="small">也可从下拉列表选择文字。修改即时显示；当前页面关闭后不会自动保存，请导出SVG。</p><select id="labelList"><option value="">请选择文字</option></select><label>文字内容<textarea id="labelText" rows="4"></textarea></label><label>字号（SVG画布单位）<input id="fontSize" type="number" min="10" max="150"></label><label>颜色<input id="fontColor" type="color" value="#17364e"></label><button id="applyButton">应用修改</button><button id="downloadButton">下载修改后的SVG</button><button id="resetButton">恢复初始版本</button><div id="status">SVG文字仍是文本对象。</div><p class="small">在PowerPoint中编辑请打开配套PPTX。将SVG插入PPT或Word通常会作为整体图形显示；不等于文件中的文字已转轮廓。公式使用Unicode字符，可在输入框中直接修改。</p></aside></main><script>
const area=document.getElementById('canvas'), list=document.getElementById('labelList'), edit=document.getElementById('labelText'), size=document.getElementById('fontSize'), color=document.getElementById('fontColor'), status=document.getElementById('status');let selected=null;const initial=area.innerHTML;
function populate(){list.innerHTML='<option value="">请选择文字</option>';area.querySelectorAll('svg text').forEach(t=>{const o=document.createElement('option');o.value=t.id;o.textContent=t.textContent;list.appendChild(o)})}
function choose(t){if(selected)selected.classList.remove('selected');selected=t;t.classList.add('selected');list.value=t.id;edit.value=t.textContent;size.value=t.getAttribute('font-size');const c=t.getAttribute('fill');if(/^#[0-9a-f]{6}$/i.test(c))color.value=c;status.textContent='已选择：'+t.textContent}
area.addEventListener('click',e=>{if(e.target.tagName.toLowerCase()==='text')choose(e.target)});list.addEventListener('change',()=>{const t=area.querySelector('#'+list.value);if(t)choose(t)});
function apply(){if(!selected)return;selected.textContent=edit.value;selected.setAttribute('font-size',size.value);selected.setAttribute('fill',color.value);for(const o of list.options)if(o.value===selected.id)o.textContent=edit.value;status.textContent='修改已应用，请导出SVG保存。'}
document.getElementById('applyButton').onclick=apply;edit.addEventListener('input',apply);size.addEventListener('input',apply);color.addEventListener('input',apply);
document.getElementById('downloadButton').onclick=()=>{if(selected)selected.classList.remove('selected');const clone=area.querySelector('svg').cloneNode(true);clone.querySelectorAll('.selected').forEach(t=>t.classList.remove('selected'));const content=new XMLSerializer().serializeToString(clone);const blob=new Blob([content],{type:'image/svg+xml;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Full_ECD_VCD_GA_edited.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);if(selected)selected.classList.add('selected');status.textContent='已导出SVG；文字仍保留为text对象。'};
document.getElementById('resetButton').onclick=()=>{area.innerHTML=initial;selected=null;edit.value='';populate();status.textContent='已恢复初始版本。'};populate();
</script></html>
