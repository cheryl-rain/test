  <g id="editable_text"><text id="text_3" x="1100" y="75" fill="#17364E" font-family="Arial,sans-serif" font-size="53" font-weight="700" text-anchor="middle" xml:space="preserve">Conformational search and sampling</text>
<text id="text_4" x="1100" y="129" fill="#647585" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" xml:space="preserve">Search strategies and energy evaluation shown separately</text>
<text id="text_7" x="397" y="246" fill="#07867F" font-family="Arial,sans-serif" font-size="37" font-weight="700" text-anchor="middle" xml:space="preserve">Systematic sampling</text>
<text id="text_8" x="397" y="313" fill="#17364E" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" xml:space="preserve">Torsion scans</text>
<text id="text_11" x="1107" y="246" fill="#07867F" font-family="Arial,sans-serif" font-size="37" font-weight="700" text-anchor="middle" xml:space="preserve">Stochastic sampling</text>
<text id="text_12" x="1107" y="313" fill="#17364E" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" xml:space="preserve">Monte Carlo (MC)</text>
<text id="text_15" x="1817" y="246" fill="#80529D" font-family="Arial,sans-serif" font-size="37" font-weight="700" text-anchor="middle" xml:space="preserve">Global / heuristic search</text>
<text id="text_16" x="1817" y="313" fill="#17364E" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" xml:space="preserve">Genetic algorithm (GA)</text>
<text id="text_19" x="397" y="483" fill="#80529D" font-family="Arial,sans-serif" font-size="37" font-weight="700" text-anchor="middle" xml:space="preserve">Dynamics-based sampling</text>
<text id="text_20" x="397" y="550" fill="#17364E" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" xml:space="preserve">Molecular dynamics (MD)</text>
<text id="text_23" x="1107" y="483" fill="#B98426" font-family="Arial,sans-serif" font-size="37" font-weight="700" text-anchor="middle" xml:space="preserve">Enhanced sampling</text>
<text id="text_24" x="1107" y="550" fill="#17364E" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" xml:space="preserve">REMD • MTD</text>
<text id="text_27" x="1817" y="483" fill="#B98426" font-family="Arial,sans-serif" font-size="37" font-weight="700" text-anchor="middle" xml:space="preserve">Automated hybrid sampling</text>
<text id="text_28" x="1817" y="550" fill="#17364E" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" xml:space="preserve">CREST / iMTD-GC</text>
<text id="text_29" x="1100" y="671" fill="#647585" font-family="Arial,sans-serif" font-size="33" font-weight="700" text-anchor="middle" xml:space="preserve">Low-cost energy evaluation</text>
<text id="text_31" x="1100" y="751" fill="white" font-family="Arial,sans-serif" font-size="43" font-weight="700" text-anchor="middle" xml:space="preserve">MMFF / MMFF94  •  AM1 / PM3  •  GFNn-xTB</text>
<text id="text_32" x="1100" y="840" fill="#647585" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" xml:space="preserve">Representative low-energy candidate route</text>
<text id="text_34" x="242.5" y="916" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">Generate</text>
<text id="text_35" x="242.5" y="961" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">candidates</text>
<text id="text_39" x="652.5" y="916" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">Local</text>
<text id="text_40" x="652.5" y="961" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">optimization</text>
<text id="text_44" x="1095.0" y="916" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">Energy screening</text>
<text id="text_45" x="1095.0" y="961" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">+ duplicate removal</text>
<text id="text_49" x="1537.5" y="916" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">Low-energy</text>
<text id="text_50" x="1537.5" y="961" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">candidates</text>
<text id="text_54" x="1952.5" y="916" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">DFT</text>
<text id="text_55" x="1952.5" y="961" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">refinement</text>
<text id="text_56" x="1100" y="1051" fill="#647585" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" xml:space="preserve">Categories can overlap; CREST combines MTD, MD and GC. GFNn-xTB is an energy method, not a sampling strategy.</text>
<text id="text_57" x="1100" y="1094" fill="#647585" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" xml:space="preserve">The lower route is schematic; direct calculations and averaging over MD snapshots are also discussed in the review.</text>
</g>
</svg>
