  <g id="editable_text" inkscape:groupmode="layer" inkscape:label="Editable text"><ns3:text xmlns:ns3="http://www.w3.org/2240/svg" id="text_3" x="1100" y="75" fill="#17364E" font-family="Arial,sans-serif" font-size="53" font-weight="700" text-anchor="middle" xml:space="preserve">Conformational search and sampling</ns3:text>
<ns4:text xmlns:ns4="http://www.w3.org/2240/svg" id="text_4" x="1100" y="129" fill="#647585" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" xml:space="preserve">Search strategies and energy evaluation shown separately</ns4:text>
<ns7:text xmlns:ns7="http://www.w3.org/2240/svg" id="text_7" x="397" y="246" fill="#07867F" font-family="Arial,sans-serif" font-size="37" font-weight="700" text-anchor="middle" xml:space="preserve">Systematic sampling</ns7:text>
<ns8:text xmlns:ns8="http://www.w3.org/2240/svg" id="text_8" x="397" y="313" fill="#17364E" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" xml:space="preserve">Torsion scans</ns8:text>
<ns11:text xmlns:ns11="http://www.w3.org/2240/svg" id="text_11" x="1107" y="246" fill="#07867F" font-family="Arial,sans-serif" font-size="37" font-weight="700" text-anchor="middle" xml:space="preserve">Stochastic sampling</ns11:text>
<ns12:text xmlns:ns12="http://www.w3.org/2240/svg" id="text_12" x="1107" y="313" fill="#17364E" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" xml:space="preserve">Monte Carlo (MC)</ns12:text>
<ns15:text xmlns:ns15="http://www.w3.org/2240/svg" id="text_15" x="1817" y="246" fill="#80529D" font-family="Arial,sans-serif" font-size="37" font-weight="700" text-anchor="middle" xml:space="preserve">Global / heuristic search</ns15:text>
<ns16:text xmlns:ns16="http://www.w3.org/2240/svg" id="text_16" x="1817" y="313" fill="#17364E" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" xml:space="preserve">Genetic algorithm (GA)</ns16:text>
<ns19:text xmlns:ns19="http://www.w3.org/2240/svg" id="text_19" x="397" y="483" fill="#80529D" font-family="Arial,sans-serif" font-size="37" font-weight="700" text-anchor="middle" xml:space="preserve">Dynamics-based sampling</ns19:text>
<ns20:text xmlns:ns20="http://www.w3.org/2240/svg" id="text_20" x="397" y="550" fill="#17364E" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" xml:space="preserve">Molecular dynamics (MD)</ns20:text>
<ns23:text xmlns:ns23="http://www.w3.org/2240/svg" id="text_23" x="1107" y="483" fill="#B98426" font-family="Arial,sans-serif" font-size="37" font-weight="700" text-anchor="middle" xml:space="preserve">Enhanced sampling</ns23:text>
<ns24:text xmlns:ns24="http://www.w3.org/2240/svg" id="text_24" x="1107" y="550" fill="#17364E" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" xml:space="preserve">REMD • MTD</ns24:text>
<ns27:text xmlns:ns27="http://www.w3.org/2240/svg" id="text_27" x="1817" y="483" fill="#B98426" font-family="Arial,sans-serif" font-size="37" font-weight="700" text-anchor="middle" xml:space="preserve">Automated hybrid sampling</ns27:text>
<ns28:text xmlns:ns28="http://www.w3.org/2240/svg" id="text_28" x="1817" y="550" fill="#17364E" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" xml:space="preserve">CREST / iMTD-GC</ns28:text>
<ns29:text xmlns:ns29="http://www.w3.org/2240/svg" id="text_29" x="1100" y="671" fill="#647585" font-family="Arial,sans-serif" font-size="33" font-weight="700" text-anchor="middle" xml:space="preserve">Low-cost energy evaluation</ns29:text>
<ns31:text xmlns:ns31="http://www.w3.org/2240/svg" id="text_31" x="1100" y="751" fill="white" font-family="Arial,sans-serif" font-size="43" font-weight="700" text-anchor="middle" xml:space="preserve">MMFF / MMFF94  •  AM1 / PM3  •  GFNn-xTB</ns31:text>
<ns32:text xmlns:ns32="http://www.w3.org/2240/svg" id="text_32" x="1100" y="840" fill="#647585" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" xml:space="preserve">Representative low-energy candidate route</ns32:text>
<ns34:text xmlns:ns34="http://www.w3.org/2240/svg" id="text_34" x="242.5" y="916" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">Generate</ns34:text>
<ns35:text xmlns:ns35="http://www.w3.org/2240/svg" id="text_35" x="242.5" y="961" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">candidates</ns35:text>
<ns39:text xmlns:ns39="http://www.w3.org/2240/svg" id="text_39" x="652.5" y="916" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">Local</ns39:text>
<ns40:text xmlns:ns40="http://www.w3.org/2240/svg" id="text_40" x="652.5" y="961" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">optimization</ns40:text>
<ns44:text xmlns:ns44="http://www.w3.org/2240/svg" id="text_44" x="1095.0" y="916" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">Energy screening</ns44:text>
<ns45:text xmlns:ns45="http://www.w3.org/2240/svg" id="text_45" x="1095.0" y="961" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">+ duplicate removal</ns45:text>
<ns49:text xmlns:ns49="http://www.w3.org/2240/svg" id="text_49" x="1537.5" y="916" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">Low-energy</ns49:text>
<ns50:text xmlns:ns50="http://www.w3.org/2240/svg" id="text_50" x="1537.5" y="961" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">candidates</ns50:text>
<ns54:text xmlns:ns54="http://www.w3.org/2240/svg" id="text_54" x="1952.5" y="916" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">DFT</ns54:text>
<ns55:text xmlns:ns55="http://www.w3.org/2240/svg" id="text_55" x="1952.5" y="961" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">refinement</ns55:text>
<ns56:text xmlns:ns56="http://www.w3.org/2240/svg" id="text_56" x="1100" y="1051" fill="#647585" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" xml:space="preserve">Categories can overlap; CREST combines MTD, MD and GC. GFNn-xTB is an energy method, not a sampling strategy.</ns56:text>
<ns57:text xmlns:ns57="http://www.w3.org/2240/svg" id="text_57" x="1100" y="1094" fill="#647585" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" xml:space="preserve">The lower route is schematic; direct calculations and averaging over MD snapshots are also discussed in the review.</ns57:text>
</g>
</svg>
