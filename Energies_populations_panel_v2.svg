  <g id="editable_text" inkscape:groupmode="layer" inkscape:label="Editable text"><text id="text_4" x="500" y="86" fill="#17364E" font-family="Arial,sans-serif" font-size="49" font-weight="700" text-anchor="middle" xml:space="preserve">3  Energies &amp; populations</text>
<text id="text_5" x="500" y="139" fill="#647585" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" xml:space="preserve">Population calculations for low-energy conformers</text>
<text id="text_7" x="500" y="213" fill="#07867F" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle" xml:space="preserve">Conformational energies and Boltzmann populations</text>
<text id="text_8" x="300" y="251" fill="#647585" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" xml:space="preserve">Relative Gibbs free energy</text>
<text id="text_9" x="725" y="251" fill="#647585" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" xml:space="preserve">Population (Σpᵢ = 1)</text>
<text id="text_14" x="216" y="421" fill="#647585" font-family="Arial,sans-serif" font-size="32" font-weight="400" text-anchor="end" xml:space="preserve">C1</text>
<text id="text_16" x="565" y="419" fill="#07867F" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="end" xml:space="preserve">C1</text>
<text id="text_18" x="216" y="377" fill="#647585" font-family="Arial,sans-serif" font-size="32" font-weight="400" text-anchor="end" xml:space="preserve">C2</text>
<text id="text_20" x="565" y="375" fill="#80529D" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="end" xml:space="preserve">C2</text>
<text id="text_22" x="216" y="333" fill="#647585" font-family="Arial,sans-serif" font-size="32" font-weight="400" text-anchor="end" xml:space="preserve">C3</text>
<text id="text_24" x="565" y="331" fill="#B98426" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="end" xml:space="preserve">C3</text>
<text id="text_26" x="216" y="289" fill="#647585" font-family="Arial,sans-serif" font-size="32" font-weight="400" text-anchor="end" xml:space="preserve">C4</text>
<text id="text_28" x="565" y="287" fill="#8ABBB3" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="end" xml:space="preserve">C4</text>
<text id="text_31" x="500" y="476" fill="#17364E" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="middle" xml:space="preserve">pᵢ = exp(−ΔGᵢ/RT) / Σⱼ exp(−ΔGⱼ/RT)</text>
<text id="text_32" x="500" y="519" fill="#647585" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" xml:space="preserve">ΔGᵢ = Gᵢ − Gmin;  R: gas constant;  T: absolute temperature</text>
<text id="text_33" x="500" y="556" fill="#647585" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" xml:space="preserve">Multilevel option: single-point energy + corrections</text>
<text id="text_34" x="280" y="601" fill="#17364E" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" xml:space="preserve">Electronic energy</text>
<text id="text_35" x="718" y="601" fill="#17364E" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" xml:space="preserve">Electronic energy + ZPVE</text>
<text id="text_36" x="280" y="639" fill="#17364E" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" xml:space="preserve">Enthalpy (H)</text>
<text id="text_37" x="718" y="639" fill="#17364E" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" xml:space="preserve">Gibbs free energy (G)</text>
<text id="text_39" x="500" y="700" fill="#07867F" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" xml:space="preserve">Thermodynamic corrections and low-frequency vibrations</text>
<text id="text_40" x="500" y="735" fill="#17364E" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle" xml:space="preserve">RRHO • qRRHO • hindered-rotor model</text>
<text id="text_41" x="500" y="776" fill="#647585" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" xml:space="preserve">Thermochemical post-processing: Shermo</text>
<text id="text_42" x="500" y="824" fill="#647585" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" xml:space="preserve">Alternative population / averaging route</text>
<text id="text_44" x="500" y="888" fill="#80529D" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle" xml:space="preserve">Conformational populations based on MD sampling</text>
<text id="text_45" x="500" y="929" fill="#647585" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" xml:space="preserve">Adequate sampling and equilibration</text>
<text id="text_61" x="120" y="1068" fill="#647585" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="end" xml:space="preserve">C1</text>
<text id="text_62" x="120" y="1033" fill="#647585" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="end" xml:space="preserve">C2</text>
<text id="text_63" x="120" y="998" fill="#647585" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="end" xml:space="preserve">C3</text>
<text id="text_64" x="349.5" y="1111" fill="#647585" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" xml:space="preserve">Time</text>
<text id="text_67" x="670" y="993" fill="#07867F" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="end" xml:space="preserve">C1</text>
<text id="text_69" x="670" y="1029" fill="#80529D" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="end" xml:space="preserve">C2</text>
<text id="text_71" x="670" y="1065" fill="#B98426" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="end" xml:space="preserve">C3</text>
<text id="text_73" x="760" y="1111" fill="#80529D" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" xml:space="preserve">Statistical weights</text>
<text id="text_74" x="500" y="1160" fill="#17364E" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">Direct averaging of snapshot spectra</text>
<text id="text_75" x="500" y="1206" fill="#17364E" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" xml:space="preserve">or weighting by MD-derived state probabilities</text>
<text id="text_77" x="500" y="1315" fill="#07867F" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" xml:space="preserve">Conformational weights → spectral averaging</text>
<text id="text_78" x="500" y="1363" fill="#647585" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" xml:space="preserve">Energy choice and low-frequency treatment affect the resulting weights.</text>
<text id="text_79" x="500" y="1396" fill="#647585" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" xml:space="preserve">Schematic levels and MD statistics; neither route is universally superior.</text>
</g>
</svg>
