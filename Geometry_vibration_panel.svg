  <g id="editable_text" inkscape:groupmode="layer" inkscape:label="Editable text"><text id="text_4" x="500" y="81" fill="#17364E" font-family="Arial,sans-serif" font-size="47" font-weight="700" text-anchor="middle" xml:space="preserve">2  Geometry Optimization</text>
<text id="text_5" x="500" y="139" fill="#17364E" font-family="Arial,sans-serif" font-size="47" font-weight="700" text-anchor="middle" xml:space="preserve">&amp; Vibrational Analysis</text>
<text id="text_6" x="139" y="206" fill="#17364E" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" xml:space="preserve">Energy</text>
<text id="text_20" x="104" y="291" fill="#647585" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" xml:space="preserve">E</text>
<text id="text_21" x="139" y="401" fill="#17364E" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" xml:space="preserve">Gradient norm</text>
<text id="text_36" x="867" y="496" fill="#B98426" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="end" xml:space="preserve">Convergence threshold</text>
<text id="text_38" x="102" y="487" fill="#647585" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="400" text-anchor="middle" xml:space="preserve">‖∇E‖</text>
<text id="text_39" x="500" y="579" fill="#647585" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" xml:space="preserve">Optimization steps</text>
<text id="text_40" x="500" y="637" fill="#07867F" font-family="Arial,sans-serif" font-size="33" font-weight="700" text-anchor="middle" xml:space="preserve">Converged geometry → frequency check</text>
<text id="text_43" x="500" y="729" fill="#17364E" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="middle" xml:space="preserve">Harmonic vibrational analysis</text>
<text id="text_45" x="186.0" y="798" fill="#07867F" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">Hessian</text>
<text id="text_46" x="186.0" y="839" fill="#17364E" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" xml:space="preserve">Energy curvature</text>
<text id="text_50" x="505.0" y="798" fill="#07867F" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">Mass-weighting</text>
<text id="text_51" x="505.0" y="839" fill="#17364E" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" xml:space="preserve">+ diagonalization</text>
<text id="text_55" x="819.0" y="798" fill="#07867F" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">Normal modes</text>
<text id="text_56" x="819.0" y="839" fill="#17364E" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" xml:space="preserve">+ frequencies</text>
<text id="text_64" x="272" y="951" fill="#07867F" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">No imaginary frequencies</text>
<text id="text_65" x="272" y="995" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">Local minimum</text>
<text id="text_67" x="727" y="951" fill="#B98426" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" xml:space="preserve">ZPVE + thermal corrections</text>
<text id="text_68" x="727" y="995" fill="#17364E" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" xml:space="preserve">H and G at temperature T</text>
<text id="text_71" x="500" y="1101" fill="#07867F" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">Representative DFT functionals</text>
<text id="text_72" x="500" y="1146" fill="#17364E" font-family="Arial,sans-serif" font-size="33" font-weight="700" text-anchor="middle" xml:space="preserve">B3LYP • PBE0 • M06-2X • ωB97X-D</text>
<text id="text_74" x="242" y="1227" fill="#80529D" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" xml:space="preserve">Dispersion correction</text>
<text id="text_75" x="242" y="1280" fill="#17364E" font-family="Arial,sans-serif" font-size="36" font-weight="700" text-anchor="middle" xml:space="preserve">D3 / D4</text>
<text id="text_77" x="692" y="1227" fill="#B98426" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" xml:space="preserve">Representative basis sets</text>
<text id="text_78" x="692" y="1264" fill="#17364E" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" xml:space="preserve">Double-ζ: 6-31G(d) / def2-SVP</text>
<text id="text_79" x="692" y="1301" fill="#17364E" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" xml:space="preserve">Triple-ζ: 6-311G(d,p) / def2-TZVP</text>
<text id="text_80" x="500" y="1355" fill="#647585" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" xml:space="preserve">Diffuse functions for ions • Solvent matched to experiment</text>
<text id="text_81" x="500" y="1391" fill="#647585" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" xml:space="preserve">Schematic convergence; translation/rotation zero modes are excluded.</text>
</g>
