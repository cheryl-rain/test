  <g id="editable_text" inkscape:groupmode="layer" inkscape:label="Editable text"><text id="text_4" x="500" y="81" fill="#17364E" font-family="Arial,sans-serif" font-size="47" font-weight="700" text-anchor="middle" xml:space="preserve">2  Geometry Optimization</text>
<text id="text_5" x="500" y="139" fill="#17364E" font-family="Arial,sans-serif" font-size="47" font-weight="700" text-anchor="middle" xml:space="preserve">&amp; Vibrational Analysis</text>
<text id="text_24" x="81" y="225" fill="#647585" font-family="Arial,sans-serif" font-size="37" font-weight="400" text-anchor="middle" xml:space="preserve">E</text>
<text id="text_25" x="503.5" y="554" fill="#647585" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" xml:space="preserve">Geometry coordinate</text>
<text id="text_26" x="500" y="590" fill="#17364E" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle" xml:space="preserve">Energy + gradient → optimized geometry</text>
<text id="text_27" x="500" y="637" fill="#07867F" font-family="DejaVu Sans,sans-serif" font-size="35" font-weight="700" text-anchor="middle" xml:space="preserve">Stationary point: ∇E = 0</text>
<text id="text_30" x="500" y="729" fill="#17364E" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="middle" xml:space="preserve">Harmonic vibrational analysis</text>
<text id="text_32" x="186.0" y="798" fill="#07867F" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">Hessian</text>
<text id="text_33" x="186.0" y="839" fill="#17364E" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" xml:space="preserve">Energy curvature</text>
<text id="text_37" x="505.0" y="798" fill="#07867F" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">Mass-weighting</text>
<text id="text_38" x="505.0" y="839" fill="#17364E" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" xml:space="preserve">+ diagonalization</text>
<text id="text_42" x="819.0" y="798" fill="#07867F" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">Normal modes</text>
<text id="text_43" x="819.0" y="839" fill="#17364E" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" xml:space="preserve">+ frequencies</text>
<text id="text_51" x="272" y="951" fill="#07867F" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">No imaginary frequencies</text>
<text id="text_52" x="272" y="995" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">Local minimum</text>
<text id="text_54" x="727" y="951" fill="#B98426" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" xml:space="preserve">ZPVE + thermal corrections</text>
<text id="text_55" x="727" y="995" fill="#17364E" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" xml:space="preserve">H and G at temperature T</text>
<text id="text_58" x="500" y="1101" fill="#07867F" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">Representative DFT functionals</text>
<text id="text_59" x="500" y="1146" fill="#17364E" font-family="Arial,sans-serif" font-size="33" font-weight="700" text-anchor="middle" xml:space="preserve">B3LYP • PBE0 • M06-2X • ωB97X-D</text>
<text id="text_61" x="242" y="1227" fill="#80529D" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" xml:space="preserve">Dispersion correction</text>
<text id="text_62" x="242" y="1280" fill="#17364E" font-family="Arial,sans-serif" font-size="36" font-weight="700" text-anchor="middle" xml:space="preserve">D3 / D4</text>
<text id="text_64" x="692" y="1227" fill="#B98426" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" xml:space="preserve">Representative basis sets</text>
<text id="text_65" x="692" y="1264" fill="#17364E" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" xml:space="preserve">Double-ζ: 6-31G(d) / def2-SVP</text>
<text id="text_66" x="692" y="1301" fill="#17364E" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" xml:space="preserve">Triple-ζ: 6-311G(d,p) / def2-TZVP</text>
<text id="text_67" x="500" y="1355" fill="#647585" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" xml:space="preserve">Diffuse functions for ions • Solvent matched to experiment</text>
<text id="text_68" x="500" y="1391" fill="#647585" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" xml:space="preserve">Schematic PES; exclude translation/rotation zero modes in the frequency check.</text>
