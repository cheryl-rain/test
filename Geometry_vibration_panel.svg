  <g id="editable_text" inkscape:groupmode="layer" inkscape:label="Editable text"><text id="text_4" x="500" y="81" fill="#17364E" font-family="Arial,sans-serif" font-size="47" font-weight="700" text-anchor="middle" xml:space="preserve">2  Geometry Optimization</text>
<text id="text_5" x="500" y="139" fill="#17364E" font-family="Arial,sans-serif" font-size="47" font-weight="700" text-anchor="middle" xml:space="preserve">&amp; Vibrational Analysis</text>
<text id="text_7" x="500" y="226" fill="#17364E" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle" xml:space="preserve">Candidate geometry</text>
<text id="text_11" x="500" y="313" fill="#07867F" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" xml:space="preserve">Evaluate energy and gradient</text>
<text id="text_12" x="500" y="348" fill="#17364E" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="400" text-anchor="middle" xml:space="preserve">E(R), ∇E(R)</text>
<text id="text_16" x="500" y="467" fill="#07867F" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" xml:space="preserve">Convergence check</text>
<text id="text_20" x="211" y="441" fill="#07867F" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" xml:space="preserve">No</text>
<text id="text_22" x="165" y="548" fill="#17364E" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle" xml:space="preserve">Update geometry</text>
<text id="text_23" x="165" y="579" fill="#647585" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" xml:space="preserve">R → R + ΔR</text>
<text id="text_30" x="557" y="565" fill="#07867F" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" xml:space="preserve">Yes</text>
<text id="text_32" x="500" y="638" fill="#17364E" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" xml:space="preserve">Optimized geometry</text>
<text id="text_35" x="500" y="729" fill="#17364E" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="middle" xml:space="preserve">Harmonic vibrational analysis</text>
<text id="text_37" x="186.0" y="798" fill="#07867F" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">Hessian</text>
<text id="text_38" x="186.0" y="839" fill="#17364E" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" xml:space="preserve">Energy curvature</text>
<text id="text_42" x="505.0" y="798" fill="#07867F" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">Mass-weighting</text>
<text id="text_43" x="505.0" y="839" fill="#17364E" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" xml:space="preserve">+ diagonalization</text>
<text id="text_47" x="819.0" y="798" fill="#07867F" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">Normal modes</text>
<text id="text_48" x="819.0" y="839" fill="#17364E" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" xml:space="preserve">+ frequencies</text>
<text id="text_56" x="272" y="951" fill="#07867F" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">No imaginary frequencies</text>
<text id="text_57" x="272" y="995" fill="#17364E" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" xml:space="preserve">Local minimum</text>
<text id="text_59" x="727" y="951" fill="#B98426" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" xml:space="preserve">ZPVE + thermal corrections</text>
<text id="text_60" x="727" y="995" fill="#17364E" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" xml:space="preserve">H and G at temperature T</text>
<text id="text_63" x="500" y="1101" fill="#07867F" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" xml:space="preserve">Representative DFT functionals</text>
<text id="text_64" x="500" y="1146" fill="#17364E" font-family="Arial,sans-serif" font-size="33" font-weight="700" text-anchor="middle" xml:space="preserve">B3LYP • PBE0 • M06-2X • ωB97X-D</text>
<text id="text_66" x="242" y="1227" fill="#80529D" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" xml:space="preserve">Dispersion correction</text>
<text id="text_67" x="242" y="1280" fill="#17364E" font-family="Arial,sans-serif" font-size="36" font-weight="700" text-anchor="middle" xml:space="preserve">D3 / D4</text>
<text id="text_69" x="692" y="1227" fill="#B98426" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" xml:space="preserve">Representative basis sets</text>
<text id="text_70" x="692" y="1264" fill="#17364E" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" xml:space="preserve">Double-ζ: 6-31G(d) / def2-SVP</text>
<text id="text_71" x="692" y="1301" fill="#17364E" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" xml:space="preserve">Triple-ζ: 6-311G(d,p) / def2-TZVP</text>
<text id="text_72" x="500" y="1355" fill="#647585" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" xml:space="preserve">Diffuse functions for ions • Solvent matched to experiment</text>
<text id="text_73" x="500" y="1391" fill="#647585" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" xml:space="preserve">Schematic iterative workflow; translation/rotation zero modes are excluded.</text>
</g>
</svg>
